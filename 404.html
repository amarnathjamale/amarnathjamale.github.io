<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Amarnath Jamale</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0e14; color: #e6edf3;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      background-image: radial-gradient(circle, rgba(148,163,184,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      padding: 24px;
    }
    .term {
      width: 100%; max-width: 640px; background: #0c1018;
      border: 1px solid #2d3b52; border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .bar { display: flex; gap: 7px; padding: 12px 14px; background: #161e2c; border-bottom: 1px solid #1f2937; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .body { padding: 24px; font-size: 0.9rem; line-height: 2; }
    .p { color: #4ade80; }
    .err { color: #f87171; }
    .dim { color: #64748b; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="term">
    <div class="bar" aria-hidden="true">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
    </div>
    <div class="body">
      <div><span class="p">$</span> kubectl get page <span class="dim">--namespace=amar.jamale.org</span></div>
      <div class="err">Error from server (NotFound): the requested page was not<br>found — HTTP 404</div>
      <div>&nbsp;</div>
      <div><span class="p">$</span> kubectl describe fix</div>
      <div class="dim">Recommended action: reconcile to a known-good state.</div>
      <div>&nbsp;</div>
      <div><span class="p">$</span> <a href="/">cd ~ &amp;&amp; ./go-home.sh</a><span class="p">▌</span></div>
    </div>
  </main>
</body>
</html>
